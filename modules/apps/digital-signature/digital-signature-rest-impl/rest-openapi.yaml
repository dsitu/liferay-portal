components:
    schemas:
        DSDocument:
            properties:
                assignTabsToDSRecipientId:
                    type: string
                data:
                    type: string
                fileEntryExternalReferenceCode:
                    type: string
                fileExtension:
                    type: string
                id:
                    type: string
                name:
                    type: string
                transformPDFFields:
                    type: boolean
                uri:
                    type: string
        DSEnvelope:
            properties:
                dateCreated:
                    format: date
                    readOnly: true
                    type: string
                dateModified:
                    format: date
                    readOnly: true
                    type: string
                dsDocument:
                    items:
                        $ref: "#/components/schemas/DSDocument"
                        type: array
                dsRecipient:
                    items:
                        $ref: "#/components/schemas/DSRecipient"
                        type: array
                emailBlurb:
                    type: string
                emailSubject:
                    type: string
                id:
                    type: string
                name:
                    type: string
                senderEmailAddress:
                    type: string
                siteId:
                    format: int64
                    type: integer
                status:
                    type: string
            type: object
        DSEnvelopeSignatureURL:
            properties:
                url:
                    type: string
        DSRecipient:
            properties:
                dsClientUserId:
                    type: string
                emailAddress:
                    type: string
                id:
                    type: string
                name:
                    type: string
                status:
                    type: string
                tabs:
                    type: object
        DSRecipientViewDefinition:
            properties:
                authenticationMethod:
                    type: string
                dsClientUserId:
                    type: string
                emailAddress:
                    type: string
                returnURL:
                    type: string
                userName:
                    type: string
        SignatureRequest:
            description:
                A request for one or more documents to be signed, as Liferay records it. Read from local records, so reading one costs no call to the signature provider.
            properties:
                actions:
                    additionalProperties:
                        additionalProperties:
                            type: string
                        type: object
                    description:
                        Actions the current user can take on the request, such as signing it when it is their turn. Read-only.
                    readOnly: true
                    type: object
                dateCreated:
                    description:
                        When the request was created. Read-only.
                    format: date-time
                    readOnly: true
                    type: string
                documentTitles:
                    description:
                        Titles of the documents to be signed, separated by commas. Read-only.
                    readOnly: true
                    type: string
                emailBody:
                    description:
                        Body of the notification sent to each signer.
                    type: string
                emailSubject:
                    description:
                        Subject of the notification sent to each signer.
                    type: string
                expirationDate:
                    description:
                        When the provider voids the request if it is still unsigned. Read-only; derived from the expiration supplied on creation.
                    format: date-time
                    readOnly: true
                    type: string
                expireAfter:
                    description:
                        Days until the request expires. Zero leaves it open.
                    type: integer
                expireWarn:
                    description:
                        Days before expiration to warn the signers. Must be fewer than the days until expiration.
                    type: integer
                fileEntryIds:
                    description:
                        Document library file entries to be signed. Supplied on creation; not returned on read.
                    items:
                        format: int64
                        type: integer
                    type: array
                id:
                    description:
                        Identifier of the request. Read-only; assigned by the server.
                    format: int64
                    readOnly: true
                    type: integer
                name:
                    description:
                        Name of the request.
                    type: string
                providerKey:
                    description:
                        Signature provider holding the request. Read-only.
                    readOnly: true
                    type: string
                providerRequestId:
                    description:
                        Identifier the provider assigned to the request. Read-only.
                    readOnly: true
                    type: string
                requesterEmailAddress:
                    description:
                        Email address of the user who sent the request. Read-only.
                    readOnly: true
                    type: string
                requesterName:
                    description:
                        Name of the user who sent the request. Read-only.
                    readOnly: true
                    type: string
                requesterUserId:
                    description:
                        Identifier of the user who sent the request. Read-only.
                    format: int64
                    readOnly: true
                    type: integer
                sendNotifications:
                    description:
                        Whether Liferay emails each signer a link to sign. Defaults to true.
                    type: boolean
                signatureRequestRecipients:
                    description:
                        The signers on the request. Supply a user identifier for each one when creating; every other field is read-only.
                    items:
                        $ref: "#/components/schemas/SignatureRequestRecipient"
                    type: array
                status:
                    description:
                        Status of the request as Liferay last recorded it. Set it to "voided" with a PATCH to cancel the request; no other status can be set.
                    type: string
                statusDate:
                    description:
                        When the status last changed. Read-only.
                    format: date-time
                    readOnly: true
                    type: string
                voidReason:
                    description:
                        Why the request is being canceled, sent to the signature provider when the status is set to "voided". Write-only.
                    type: string
                    writeOnly: true
            type: object
        SignatureRequestRecipient:
            description:
                One signer on a signature request.
            properties:
                emailAddress:
                    description:
                        Email address of the signer. Read-only; taken from the user.
                    readOnly: true
                    type: string
                name:
                    description:
                        Name of the signer. Read-only; taken from the user.
                    readOnly: true
                    type: string
                providerRecipientId:
                    description:
                        Identifier the provider assigned to the signer. Read-only.
                    readOnly: true
                    type: string
                sentDate:
                    description:
                        When the signer was notified. Read-only.
                    format: date-time
                    readOnly: true
                    type: string
                status:
                    description:
                        Status of this signer. Read-only.
                    readOnly: true
                    type: string
                statusDate:
                    description:
                        When this signer's status last changed. Read-only.
                    format: date-time
                    readOnly: true
                    type: string
                userId:
                    description:
                        Liferay user who must sign. Required when creating a request.
                    format: int64
                    type: integer
            type: object
info:
    description:
        "A Java client JAR is available for use with the group ID 'com.liferay', artifact ID 'com.liferay.digital.signature.rest.client', and version '1.0.37'."
